{% load static %}
<html>
  <head>
    <title>Taxonomy Graph</title>
    <link href="{% static "css/dist/bootstrap.min.css" %}" rel="stylesheet">
    <script src="{% static "js/dist/jquery.min.js" %}"></script>
    <script src="{% static "js/dist/bootstrap.bundle.min.js" %}"></script>
    <style>
      .btn-sm { padding: 0px 4px 0px 4px; }
      .shb_deep {
      background-color: #40aa40;
      border-color: #40aa40;
      }
      .shb_deep:hover {
      background-color: #208820;
      border-color: #208820;
      }
      .shb_deep::after {
      font-weight: 400;
      content: '\21b4';
      }
      .shb_enable::after {
      content: '\21b4';
      }
      .shb_disable::after {
      content: '\2192';
      }

      .gem_info {
      border: 1px solid black;
      padding: 8px;
      display: inline-block;
      }

      .item_info {
      margin-left: 50px;
      font-family: serif;
      transform:scale(1.5,1);
      -webkit-transform:scale(1.5,1);
      -moz-transform:scale(1.5,1);
      -ms-transform:scale(1.5,1);
      -o-transform:scale(1.5,1);
      }

      .item_info::after {
      content: 'i';
      }
      .atom_highlight > h5 {
      font-weight: bold;
      }

      .atom_highlight > h5::before {
      /* Right-Pointing Magnifying Glass */
      content: '\1F50E  ';
      }

      h5.gem_atom {
      margin: 4px 4px 4px 0px;
      }
    </style>
    <script>
      {% include 'taxtcomm_incl.js' %}
      {% include 'taxtgraph_incl.js' %}
      //-->
          </script>
          <script>
            window.onload = function () {
                fetch('{{ STATIC_URL }}taxtweb/json/taxonomy_standard4taxtweb.json')
                    .then((response) => response.json())
                    .then(function (json){
                gem_tax = json;

                $('#atom-search-form').on('submit', function (event) {
                    taxtgraph_form_highlightatom_cb(event);
                    return false;
                    });

                taxtgraph_main();

                const queryString = window.location.search;
                const urlParams = new URLSearchParams(queryString);
                const searched_atom = urlParams.get('atom');
                if (searched_atom != null) {
                    taxtgraph_highlightatom(searched_atom);
                }
            });
        }
    </script>
  </head>
          <body>
            <h1>Taxonomy Graph</h1>
     <div style="background-color: #f0f0f0; padding: 8px;">
       <button type="button" style="margin: 8px;" class="btn btn-primary btn-sm" onclick="taxtgraph_compress_all();">Collapse All</button>
       <button type="button" style="margin: 8px;" class="btn btn-primary btn-sm" onclick="taxtgraph_uncompress_all();">Expand All</button>
       <hr>
       <form style="margin: 8px;" action="#" id="atom-search-form">
         <p style="margin: 8px;">Atom Name: <input name="atom" type="text" value=""> <button type="submit" class="btn btn-primary btn-sm">Search</button> <a role="button" name="atom-search-link" class="btn btn-primary btn-sm" href="">Link</a></p>
       </form>
    </div>
    <div id="app"/>
  </body>
</html>
